[project]
name = "finance-core"
version = "0.0.1"
description = "Quantitative finance primitives for CURS Portfolio Tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_core"]
