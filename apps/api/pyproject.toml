[project]
name = "curs-api"
version = "0.0.1"
description = "CURS Portfolio Tracker — REST + WebSocket API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tortoise-orm[asyncpg]>=0.21.0",
    # <0.8: aerich 0.8+ сменил формат файлов миграций и отвергает старый формат
    # (миграции 0/1 сгенерированы 0.7.x). Держим совместимую версию.
    "aerich>=0.7.2,<0.8",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "typer>=0.13.0",
    "tenacity>=9.0.0",
    "finance-core",
]

[tool.uv.sources]
finance-core = { path = "../../packages/finance-core" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curs_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.aerich]
tortoise_orm = "curs_api.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"
