[project]
name = "curs-workers"
version = "0.0.1"
description = "CURS Portfolio Tracker — async polling workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tortoise-orm[asyncpg]>=0.21.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "curs-api",
    "finance-core",
]

[tool.uv.sources]
curs-api = { path = "../api" }
finance-core = { path = "../../packages/finance-core" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curs_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
